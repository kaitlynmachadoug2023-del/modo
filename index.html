<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F4F7F1"><title>MODO</title><meta name="description" content="Tell MODO how you feel. It figures out how you should move, then helps you refuel from your fridge."><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2228%22%20fill%3D%22%23A9C5A0%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2226%22%20r%3D%2214%22%20fill%3D%22%23CDBEF5%22%2F%3E%3C%2Fsvg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap"><style>/* Layout: one phone-width column. On desktop it floats as a device on a soft sage field. */
:root {
  --field: #E6ECE1;      /* page ground behind the device */
  --bg: #F4F7F1;         /* app ground, sage-tinted off-white */
  --surface: #FFFFFF;
  --ink: #18241C;
  --muted: #5D6D62;
  --line: rgba(24, 36, 28, .10);
  --sage: #A9C5A0;
  --sage-soft: #DCE8D6;
  --sage-deep: #3D6B4A;
  --lav: #CDBEF5;
  --lav-soft: #ECE6FD;
  --lav-deep: #6A52C4;
  --warn: #B4541F;
  --good: #2F7D4F;
  --shadow: 0 1px 2px rgba(24,36,28,.06), 0 12px 32px -12px rgba(24,36,28,.22);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg: 28px; --r-md: 20px; --r-sm: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --field: #0C110E; --bg: #121915; --surface: #1A231D; --ink: #EAF1E6; --muted: #9DAEA2; --line: rgba(234,241,230,.10);
    --sage: #6F9772; --sage-soft: #23332A; --sage-deep: #A8D3A6; --lav: #8E78DA; --lav-soft: #2A2442; --lav-deep: #CDBEF7;
    --warn: #F0A06A; --good: #8FD3A4; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --field: #0C110E; --bg: #121915; --surface: #1A231D; --ink: #EAF1E6; --muted: #9DAEA2; --line: rgba(234,241,230,.10);
  --sage: #6F9772; --sage-soft: #23332A; --sage-deep: #A8D3A6; --lav: #8E78DA; --lav-soft: #2A2442; --lav-deep: #CDBEF7;
  --warn: #F0A06A; --good: #8FD3A4; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--field); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, label:focus-visible { outline: 3px solid var(--lav-deep); outline-offset: 2px; }
input { font: inherit; color: inherit; }

#app { height: 100%; display: flex; justify-content: center; }
.device { position: relative; width: 100%; max-width: 440px; height: 100%; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 760px) {
  #app { align-items: center; padding-block: 24px; }
  .device { height: min(900px, calc(100% - 0px)); border-radius: 40px; box-shadow: var(--shadow), 0 0 0 10px var(--surface), 0 0 0 11px var(--line); }
  .aside { display: block !important; }
}
.aside { display: none; position: fixed; left: max(24px, calc(50% - 560px)); top: 50%; transform: translateY(-50%); width: 260px; color: var(--muted); font-size: 14px; }
.aside h2 { font-family: var(--display); font-size: 44px; line-height: .95; letter-spacing: -.03em; color: var(--ink); margin: 0 0 12px; font-weight: 800; }
.aside p { margin: 0 0 10px; }
.aside .k { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--sage-deep); }

.screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 20px 28px; display: flex; flex-direction: column; animation: screenIn .35s cubic-bezier(.2,.8,.2,1); scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen > * { flex-shrink: 0; }
@keyframes screenIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0 8px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.logo { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.04em; display: flex; align-items: center; gap: 6px; }
.logo i { width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(var(--sage), var(--lav), var(--sage)); display: inline-block; font-style: normal; }
.iconbtn { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; }
.iconbtn.on { background: var(--sage-soft); }
.back { font-size: 20px; }

/* type */
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.h-hero { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 13vw, 58px); line-height: .9; letter-spacing: -.045em; margin: 10px 0 6px; text-wrap: balance; }
.h-hero em { font-style: normal; background: linear-gradient(90deg, var(--sage-deep), var(--lav-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.h1 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -.035em; margin: 6px 0 8px; text-wrap: balance; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.small { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* context strip */
.ctx { display: flex; gap: 8px; overflow-x: auto; margin: 14px -20px 0; padding: 0 20px 2px; scrollbar-width: none; }
.ctx::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.bad { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--warn); }
.pill.lav { background: var(--lav-soft); }
.pill.sage { background: var(--sage-soft); }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--lav-soft); color: var(--lav-deep); }

/* moods */
.moods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.mood { text-align: left; padding: 16px 16px 14px; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 2px; min-height: 104px; transition: transform .15s, background .2s; }
.mood:hover { transform: translateY(-2px); }
.mood:active { transform: scale(.97); }
.mood .e { font-size: 34px; line-height: 1; margin-bottom: 8px; }
.mood b { font-family: var(--display); font-size: 19px; letter-spacing: -.02em; }
.mood b { display: block; }
.mood .ln { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.25; margin-top: 2px; }
.mood:nth-child(4n+1), .mood:nth-child(4n+4) { background: var(--sage-soft); box-shadow: none; }
.mood:nth-child(4n+2), .mood:nth-child(4n+3) { background: var(--lav-soft); box-shadow: none; }
.mood.wide { grid-column: span 2; flex-direction: row; align-items: center; gap: 14px; min-height: 0; }
.mood.wide .e { margin: 0; }

.nope-btn { margin-top: 14px; width: 100%; border-radius: var(--r-lg); padding: 22px 20px; background: var(--ink); color: var(--bg); text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; overflow: hidden; }
.nope-btn b { font-family: var(--display); font-size: 26px; line-height: 1; letter-spacing: -.03em; display: block; }
.nope-btn span { font-size: 13px; opacity: .7; }
.nope-btn .arrow { font-size: 28px; transition: transform .2s; }
.nope-btn:hover .arrow { transform: translateX(4px) rotate(-8deg); }

/* questions */
.progress { display: flex; gap: 6px; margin: 4px 0 18px; }
.progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.progress i.on { background: var(--sage-deep); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; transition: transform .12s, box-shadow .2s, background .2s; }
.opt:active { transform: scale(.98); }
.opt .e { font-size: 30px; width: 40px; text-align: center; }
.opt b { font-family: var(--display); font-size: 21px; letter-spacing: -.02em; }
.opt.sel { background: var(--lav-soft); box-shadow: inset 0 0 0 2px var(--lav-deep); }
.times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.time { aspect-ratio: 1 / 1.15; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.time b { font-family: var(--display); font-size: 30px; letter-spacing: -.04em; line-height: 1; }
.time span { font-size: 12px; color: var(--muted); }
.time.sel { background: var(--sage-soft); box-shadow: inset 0 0 0 2px var(--sage-deep); }
.places { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.places .opt:last-child { grid-column: span 2; }

/* buttons */
.cta { width: 100%; padding: 18px 20px; border-radius: 999px; background: var(--sage-deep); color: var(--bg); font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; transition: transform .12s, opacity .2s; }
.cta:active { transform: scale(.98); }
.cta:disabled { opacity: .35; cursor: default; }
.cta.lav { background: var(--lav-deep); }
.ghost { width: 100%; padding: 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; background: transparent; }
.linkbtn { color: var(--lav-deep); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.foot { margin-top: auto; padding-top: 18px; display: grid; gap: 10px; }

/* swipe deck */
.deck { position: relative; flex: 1 0 auto; min-height: 420px; max-height: 540px; margin: 10px 0 14px; }
.card { position: absolute; inset: 0; border-radius: var(--r-lg); padding: 22px; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; box-shadow: var(--shadow); overflow: hidden; }
.card.c0 { background: linear-gradient(160deg, var(--sage-soft), var(--surface) 70%); }
.card.c1 { background: linear-gradient(160deg, var(--lav-soft), var(--surface) 70%); }
.card .big-e { font-size: 104px; line-height: 1; margin: 18px 0 auto 4px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.12)); }
.card h3 { font-family: var(--display); font-weight: 800; font-size: 36px; line-height: .95; letter-spacing: -.04em; margin: 14px 0 8px; text-wrap: balance; }
.card p { margin: 0 0 16px; color: var(--muted); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { padding: 8px 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.effort { display: inline-flex; gap: 2px; }
.effort i { width: 4px; height: 12px; border-radius: 2px; background: var(--line); }
.effort i.on { background: var(--ink); }
.stamp { position: absolute; top: 26px; padding: 6px 14px; border-radius: 12px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; border: 3px solid; opacity: 0; pointer-events: none; }
.stamp.yes { left: 22px; color: var(--sage-deep); border-color: var(--sage-deep); transform: rotate(-10deg); }
.stamp.no { right: 22px; color: var(--warn); border-color: var(--warn); transform: rotate(10deg); }
.card.under { transform: scale(.94) translateY(14px); opacity: .7; }
.card.under2 { transform: scale(.88) translateY(28px); opacity: .4; }
.swipe-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sa { padding: 16px 10px; border-radius: 999px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s; }
.sa:active { transform: scale(.96); }
.sa.no { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.sa.yes { background: var(--ink); color: var(--bg); }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; }
.note.lav { background: var(--lav-soft); box-shadow: none; }
.note.sage { background: var(--sage-soft); box-shadow: none; }

/* reveal */
.reveal-card { border-radius: var(--r-lg); padding: 22px; background: linear-gradient(170deg, var(--sage-soft), var(--lav-soft)); position: relative; overflow: hidden; }
.reveal-card h2 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: .95; letter-spacing: -.04em; margin: 8px 0 10px; }
.why { font-size: 14.5px; }
.why b { font-weight: 700; }
.plan { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 2px; }
.plan li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface); }
.plan li:first-child { border-radius: 16px 16px 4px 4px; }
.plan li:last-child { border-radius: 4px 4px 16px 16px; }
.plan li .m { font-family: var(--mono); font-size: 13px; color: var(--sage-deep); font-weight: 500; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.trio div { background: var(--surface); border-radius: 16px; padding: 12px; text-align: center; }
.trio b { display: block; font-family: var(--display); font-size: 24px; letter-spacing: -.03em; line-height: 1.1; }
.trio span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: var(--mono); }
.confetti { position: absolute; inset: 0; pointer-events: none; }

/* session */
.ring { position: relative; width: min(280px, 72vw); aspect-ratio: 1; margin: 12px auto 8px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
.ring .t { font-family: var(--mono); font-size: 52px; font-weight: 500; letter-spacing: -.04em; line-height: 1; }
.step-now { text-align: center; }
.step-now b { font-family: var(--display); font-size: 26px; letter-spacing: -.03em; line-height: 1.05; display: block; text-wrap: balance; }
.steps-mini { display: flex; gap: 4px; margin: 16px 0; }
.steps-mini i { height: 6px; border-radius: 6px; background: var(--line); position: relative; overflow: hidden; }
.steps-mini i span { position: absolute; inset: 0; background: var(--sage-deep); transform-origin: left; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.toggle { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); }
.switch { width: 38px; height: 22px; border-radius: 22px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on { background: var(--sage-deep); }
.switch.on::after { transform: translateX(16px); }

/* after */
.shift { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 64px; margin: 18px 0 6px; }
.shift .arr { font-size: 28px; color: var(--muted); }
.moods.compact .mood { min-height: 0; padding: 12px; flex-direction: row; align-items: center; gap: 10px; }
.moods.compact .mood .e { font-size: 26px; margin: 0; }
.moods.compact .mood b { font-size: 16px; }
.afters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.afters .opt { flex-direction: column; gap: 4px; padding: 14px 6px; text-align: center; }
.afters .opt b { font-size: 15px; }
.bignum { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: -.04em; line-height: 1; }

/* refuel */
.fridge-wrap { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); aspect-ratio: 4 / 3.4; }
.fridge-wrap img, .fridge-wrap svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanline { position: absolute; left: 0; right: 0; height: 70px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--lav) 55%, transparent), transparent); border-bottom: 2px solid var(--lav-deep); animation: scan 1.6s ease-in-out infinite alternate; }
@keyframes scan { from { top: -70px; } to { top: 100%; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 600; animation: pop .3s cubic-bezier(.3,1.6,.5,1) both; }
.chip.on { background: var(--sage-soft); box-shadow: inset 0 0 0 1.5px var(--sage-deep); }
.chip .x { opacity: .5; font-size: 12px; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.textin { display: flex; gap: 8px; }
.textin input { flex: 1; min-width: 0; padding: 14px 16px; border-radius: 999px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.textin button { padding: 0 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; }
.scan-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scan-opt { position: relative; padding: 18px 16px; border-radius: var(--r-md); text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.scan-opt .e { font-size: 30px; margin-bottom: auto; }
.scan-opt b { font-family: var(--display); font-size: 18px; letter-spacing: -.02em; line-height: 1.05; }
.scan-opt span { font-size: 12px; color: var(--muted); }
.scan-opt.a { background: var(--ink); color: var(--bg); }
.scan-opt.a span { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.scan-opt.b { background: var(--lav-soft); }
.scan-opt input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.window { border-radius: var(--r-md); padding: 16px 18px; background: var(--ink); color: var(--bg); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.window .small { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.window .switch { background: color-mix(in srgb, var(--bg) 28%, transparent); }
.window .switch.on { background: var(--lav); }
.window .bignum { color: var(--bg); font-size: 30px; }
.recipe { border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.recipe > button { width: 100%; text-align: left; padding: 16px; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; }
.recipe .re { font-size: 34px; text-align: center; }
.recipe h4 { margin: 0; font-family: var(--display); font-size: 18px; letter-spacing: -.02em; line-height: 1.1; }
.recipe .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.recipe .fit { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; }
.fit.y { background: var(--sage-soft); color: var(--sage-deep); }
.fit.n { background: var(--lav-soft); color: var(--lav-deep); }
.recipe .body { padding: 0 16px 16px 76px; font-size: 14px; }
.recipe ol { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.recipe.special { box-shadow: inset 0 0 0 2px var(--lav-deep); background: var(--lav-soft); }
.form { display: grid; gap: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; padding: 11px 8px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.seg button.sel { background: var(--sage-soft); box-shadow: inset 0 0 0 2px var(--sage-deep); }
.num { display: flex; align-items: center; gap: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 12px; padding: 4px; }
.num button { width: 40px; height: 40px; border-radius: 10px; background: var(--bg); font-size: 20px; font-weight: 700; }
.num output { flex: 1; text-align: center; font-family: var(--mono); font-size: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* trick */
.trick-screen { background: var(--ink); color: var(--bg); }
.trick-screen .bar { background: var(--ink); }
.trick-screen .iconbtn { background: color-mix(in srgb, var(--bg) 10%, transparent); box-shadow: none; color: var(--bg); }
.trick-screen .sub, .trick-screen .small { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.trick-card { border-radius: var(--r-lg); padding: 26px 22px; background: var(--lav); color: #17121F; margin-top: 18px; position: relative; animation: tilt .5s cubic-bezier(.3,1.5,.5,1); }
.trick-card:nth-child(odd) { background: var(--sage); }
@keyframes tilt { from { transform: rotate(-4deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.trick-card .e { font-size: 64px; line-height: 1; }
.trick-card h2 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -.035em; margin: 14px 0 8px; text-wrap: balance; }
.trick-card p { margin: 0; opacity: .75; }
.trick-card .m { position: absolute; top: 22px; right: 22px; font-family: var(--mono); font-size: 13px; background: rgba(255,255,255,.55); padding: 4px 9px; border-radius: 999px; color: #17121F; }
.trick-screen .cta { background: var(--bg); color: var(--ink); }
.trick-screen .ghost { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bg) 25%, transparent); color: var(--bg); }
.photo-proof { border-radius: var(--r-md); overflow: hidden; margin-top: 12px; }
.photo-proof img { display: block; width: 100%; max-height: 260px; object-fit: cover; }

/* me */
.taste { display: grid; gap: 10px; }
.taste .grp { border-radius: var(--r-md); padding: 14px 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.taste .grp .eyebrow { margin-bottom: 6px; display: block; }
.taste .grp b { font-family: var(--display); font-size: 20px; letter-spacing: -.02em; line-height: 1.15; display: block; }
.taste .grp.hate { background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.taste .grp.like { background: var(--sage-soft); box-shadow: none; }
.taste .grp.secret { background: var(--lav-soft); box-shadow: none; }
.hist { display: grid; gap: 8px; }
.hist div { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; }
.hist .em { font-size: 20px; letter-spacing: 2px; }
.section { margin-top: 24px; display: grid; gap: 10px; }

/* sheet */
.scrim { position: absolute; inset: 0; background: rgba(10,16,12,.38); z-index: 20; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 88%; overflow-y: auto; animation: up .3s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(100%); } }
.sheet .grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 14px; }
.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-weight: 600; }
.li .e { font-size: 22px; }
.li .r { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 500; }
.li.sel { box-shadow: inset 0 0 0 2px var(--sage-deep); background: var(--sage-soft); }
.readings { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.readings div { padding: 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.readings b { font-family: var(--display); font-size: 24px; letter-spacing: -.03em; display: block; }
.readings span { font-size: 12px; color: var(--muted); }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--lav-deep); animation: spin .8s linear infinite; margin: 20px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 30; pointer-events: none; animation: toast 2.4s forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

.stack { display: grid; gap: 12px; }
.mt { margin-top: 16px; } .mt-s { margin-top: 8px; } .mt-l { margin-top: 26px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 360px) {
  .h-hero { font-size: 40px; }
  .times { grid-template-columns: repeat(2, 1fr); }
  .time { aspect-ratio: 2 / 1; }
}

.card .fitline { font-size: 12.5px; font-weight: 600; color: var(--sage-deep); margin: 0 0 6px; font-family: var(--mono); letter-spacing: .02em; }
.notes { display: grid; gap: 6px; }
.plan-live { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 6px; }
.plan-live li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); padding: 10px 14px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.plan-live li.now { color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 2px var(--sage-deep); }
.plan-live li.done { text-decoration: line-through; opacity: .55; }
.plan-live .m { font-family: var(--mono); font-size: 12px; }

.foot.sticky { position: sticky; bottom: 0; padding-bottom: 6px; background: linear-gradient(to bottom, transparent, var(--bg) 35%); }

/* MODO — the matching brain. Pure functions, no UI. */

const store = {
  get(k, d) { try { const v = localStorage.getItem('modo:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('modo:' + k, JSON.stringify(v)); } catch (e) {} },
  clear() { try { Object.keys(localStorage).filter(k => k.startsWith('modo:')).forEach(k => localStorage.removeItem(k)); } catch (e) {} },
};

const byId = (list, id) => list.find(x => x.id === id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- context: weather + watch ---------- */

function contextNotes(ctx, place) {
  const notes = [];
  const w = ctx.weather;
  // If you've told me you're outside, I warn instead of overruling you.
  const flexible = place === 'anywhere' || place === 'home' || place === 'gym';
  if (w) {
    if (w.aqi >= 150) notes.push(flexible
      ? { kind: 'air', text: `AQI is ${w.aqi} today, so I kept you indoors.`, outdoorPenalty: 6 }
      : { kind: 'air', text: `AQI is ${w.aqi}. I’d keep it shorter, or wear a mask.`, effortCap: 6 });
    else if (w.rain) notes.push(flexible
      ? { kind: 'rain', text: 'It’s raining, so outdoor plans moved down the list.', outdoorPenalty: 4 }
      : { kind: 'rain', text: 'It’s raining. Covered court, or embrace the drama.' });
    else if (w.temp >= 37) notes.push(flexible
      ? { kind: 'heat', text: `It’s ${w.temp}° out. Indoors or near water is smarter.`, outdoorPenalty: 3 }
      : { kind: 'heat', text: `It’s ${w.temp}° out. Carry water, find shade.`, effortCap: 6 });
    else if (w.aqi && w.aqi < 100) notes.push({ kind: 'good', text: `Air’s decent (AQI ${w.aqi}). Good day to be outside.`, outdoorPenalty: -1 });
  }
  const watch = ctx.watch;
  if (watch && watch.connected) {
    if (watch.sleepMin < 360) notes.push({ kind: 'sleep', text: `You slept ${fmtSleep(watch.sleepMin)}, so I’ve capped effort at 6/10.`, effortCap: 6 });
    if (watch.steps < 4000) notes.push({ kind: 'steps', text: `Only ${watch.steps.toLocaleString('en-IN')} steps so far today. Anything counts.`, });
  }
  return notes;
}

function fmtSleep(m) { return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; }

/* ---------- taste ---------- */

function emptyTaste() { return { cats: {}, competitive: 0, swipes: 0, earlyNopes: {} }; }

function learn(taste, act, liked) {
  const t = JSON.parse(JSON.stringify(taste || emptyTaste()));
  const d = liked ? 1 : -1;
  const c = t.cats[act.cat] || { score: 0, seen: 0 };
  c.score += d; c.seen += 1; t.cats[act.cat] = c;
  if (act.competitive) t.competitive += d;
  t.swipes += 1;
  if (!liked && new Date().getHours() < 9) t.earlyNopes[act.cat] = (t.earlyNopes[act.cat] || 0) + 1;
  return t;
}

function tasteProfile(taste) {
  const t = taste || emptyTaste();
  const out = { hate: [], like: [], tolerate: [], secret: [] };
  Object.entries(t.cats).forEach(([cat, c]) => {
    let label = CATS[cat];
    if (c.score <= -1 && c.seen >= 1) {
      if (t.earlyNopes[cat] && t.earlyNopes[cat] >= c.seen) label += ' before 9am';
      out.hate.push({ cat, label, s: c.score });
    } else if (c.score >= 1) out.like.push({ cat, label, s: c.score });
    else out.tolerate.push({ cat, label, s: c.score });
  });
  out.hate.sort((a, b) => a.s - b.s); out.like.sort((a, b) => b.s - a.s);
  if (t.competitive >= 2) out.secret.push({ label: 'competitive things' });
  else if (out.like.length && out.like[0].s >= 2) out.secret.push({ label: CATS[out.like[0].cat] + ' (more than you admit)' });
  return out;
}

/* ---------- matching ---------- */

function sessionLength(act, time) {
  if (time === 60) return clamp(Math.max(act.min, 60), act.min, act.max);
  if (time < act.min) return null;            // can't fit
  return clamp(time, act.min, act.max);
}

function scoreActivity(act, sel, taste, notes, rng) {
  const place = sel.place;
  if (place !== 'anywhere' && !act.places.includes(place)) return null;
  if (place === 'anywhere' && !act.places.some(p => p === 'anywhere' || p === 'home' || p === 'outside')) return null;
  let mins = sessionLength(act, sel.time);
  if (mins == null) { if (sel.time === 5 && act.min <= 10) mins = 5; else return null; }

  const suffer = byId(SUFFERING, sel.suffer);
  let target = suffer.target;
  const caps = notes.filter(n => n.effortCap);
  const cap = caps.length ? { effortCap: Math.min(...caps.map(n => n.effortCap)) } : null;
  if (cap) target = Math.min(target, cap.effortCap);

  let s = 0;
  const reasons = [];
  if (act.moods.includes(sel.mood)) { s += 4; reasons.push('mood'); }
  s -= Math.abs(act.effort - target) * 0.7;
  if (cap && act.effort > cap.effortCap) s -= 3;
  const ctxPen = notes.reduce((a, n) => a + (n.outdoorPenalty || 0), 0);
  if (act.outdoor) s -= ctxPen;
  if (sel.time !== 60 && mins < sel.time) s -= (sel.time - mins) / 10;

  const c = taste && taste.cats[act.cat];
  if (c) s += clamp(c.score, -3, 3) * 1.3;
  if (act.competitive && taste) s += clamp(taste.competitive, -2, 3) * 0.6;
  s += (rng ? rng() : Math.random()) * 1.2;
  return { act, mins, score: s, reasons };
}

function buildFeed(sel, taste, ctx, seed) {
  const notes = contextNotes(ctx, sel.place);
  const rng = mulberry(seed || Date.now());
  const scored = ACTIVITIES.map(a => scoreActivity(a, sel, taste, notes, rng)).filter(Boolean).sort((a, b) => b.score - a.score);
  const picked = [], perCat = {};
  for (const x of scored) {
    if ((perCat[x.act.cat] || 0) >= 2) continue;
    perCat[x.act.cat] = (perCat[x.act.cat] || 0) + 1;
    picked.push(x);
    if (picked.length >= 7) break;
  }
  return { cards: picked, notes };
}

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Split a session into steps that add up exactly to the chosen minutes. */
function buildPlan(act, mins) {
  const raw = act.phases.map(([label, f]) => ({ label, exact: f * mins }));
  raw.forEach(r => r.min = Math.max(1, Math.floor(r.exact)));
  let diff = mins - raw.reduce((a, r) => a + r.min, 0);
  const order = raw.map((r, i) => i).sort((i, j) => (raw[j].exact - raw[j].min) - (raw[i].exact - raw[i].min));
  let k = 0;
  while (diff > 0) { raw[order[k % order.length]].min += 1; diff--; k++; }
  while (diff < 0) { const i = raw.reduce((b, r, j) => r.min > raw[b].min ? j : b, 0); raw[i].min -= 1; diff++; }
  return raw.filter(r => r.min > 0).map(r => ({ label: r.label, min: r.min }));
}

function whyLine(act, sel, notes) {
  const mood = byId(MOODS, sel.mood);
  const bits = [];
  bits.push(`You’re ${mood.label.toLowerCase().replace('i need to move', 'itching to move')}`);
  const sf = sel.suffer;
  bits.push(sf === 'none' ? 'want it gentle' : sf === 'little' ? 'okay with a little effort' : 'want to suffer a bit');
  const place = byId(PLACES, sel.place);
  if (sel.place === 'outside') bits.push('want to leave the house');
  else if (sel.place === 'home') bits.push('staying in');
  else if (sel.place === 'court') bits.push('have a court nearby');
  else if (sel.place === 'gym') bits.push('are at the gym');
  else bits.push('can go anywhere');
  let line = bits.join(' + ') + '.';
  const ctxNote = notes.find(n => n.kind === 'air' || n.kind === 'rain' || n.kind === 'heat' || n.kind === 'sleep');
  if (ctxNote) line += ' ' + ctxNote.text;
  return line;
}

/* ---------- energy ---------- */

function kcalBurned(effort, mins, weightKg) {
  const met = 1.6 + effort * 0.85;
  return Math.round(met * (weightKg || 62) * (mins / 60));
}

/* Mifflin-St Jeor. */
function dailyNeeds(p) {
  const base = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'm' ? 5 : p.sex === 'f' ? -161 : -78);
  const factor = { low: 1.3, some: 1.5, very: 1.7 }[p.activity] || 1.45;
  return Math.round(base * factor / 10) * 10;
}

function mealWindow(profile, burned) {
  const tdee = dailyNeeds(profile);
  const mid = tdee * 0.28 + burned * 0.35;
  const lo = Math.round((mid - 90) / 10) * 10, hi = Math.round((mid + 90) / 10) * 10;
  return { tdee, lo, hi, mid: Math.round(mid) };
}

/* ---------- ingredients + recipes ---------- */

const ING_INDEX = (() => {
  const m = {};
  INGREDIENTS.forEach(([name, emoji, syn]) => { m[name] = name; syn.forEach(s => m[s] = name); });
  return m;
})();
const ingEmoji = n => (INGREDIENTS.find(i => i[0] === n) || [n, '•'])[1];

function normalizeIngredient(s) {
  const k = String(s || '').toLowerCase().trim().replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ');
  if (!k) return null;
  if (ING_INDEX[k]) return ING_INDEX[k];
  if (k.endsWith('es') && ING_INDEX[k.slice(0, -2)]) return ING_INDEX[k.slice(0, -2)];
  if (k.endsWith('s') && ING_INDEX[k.slice(0, -1)]) return ING_INDEX[k.slice(0, -1)];
  const hit = Object.keys(ING_INDEX).find(x => x.length > 3 && (k.includes(x)));
  return hit ? ING_INDEX[hit] : k;
}

function parseIngredients(text) {
  return [...new Set(String(text).split(/[,\n;]+| and /).map(normalizeIngredient).filter(Boolean))];
}

function matchRecipes(have, win, afterWorkout) {
  const H = new Set(have);
  return RECIPES.map(r => {
    const missing = r.need.filter(n => !H.has(n));
    if (r.any && !r.any.some(n => H.has(n))) missing.push(r.any.join(' or '));
    const usesOpt = (r.opt || []).filter(n => H.has(n));
    const used = r.need.filter(n => H.has(n)).concat(r.any ? r.any.filter(n => H.has(n)) : [], usesOpt);
    let servings = 1;
    if (win && r.kcal < win.lo - 60) servings = 1.5;
    const kcal = Math.round(r.kcal * servings / 10) * 10, protein = Math.round(r.protein * servings);
    const fits = win ? kcal >= win.lo - 60 && kcal <= win.hi + 60 : true;
    let score = -missing.length * 10 + usesOpt.length * 1.2 + (afterWorkout ? protein / 8 : 0) + (fits ? 3 : 0) - r.mins / 30;
    return { ...r, missing, used, servings, kcalS: kcal, proteinS: protein, fits, score };
  }).filter(r => r.missing.length <= 1).sort((a, b) => a.missing.length - b.missing.length || b.score - a.score);
}

const AI = {
  mode: 'off',      // 'api' (our serverless route) | 'sample' (Claude inside a claude.ai artifact) | 'off'
  sample: null,
  images: false,

    } catch (e) {}

        if (s) {
          this.sample = s; this.mode = 'sample';

        }
      }
    } catch (e) {}
    return this.mode;
  },

  async json(prompt, image) {
    if (this.mode === 'api') {
      const r = await withTimeout(fetch('/api/ai', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt, image }) }), 40000);
      if (!r.ok) throw new Error('ai ' + r.status);
      const j = await r.json();
      return j.data;
    }
    if (this.mode === 'sample') {
      const opts = { modelTier: image ? 'default' : 'quick' };
      if (image && this.images) opts.images = [dataUrlToBlob(image)];
      return await this.sample.json(prompt, opts);
    }
    throw new Error('ai off');
  },

  async scanFridge(dataUrl) {
    const prompt = `You are looking at a photo of the inside of a fridge or a kitchen counter in India.
List every food ingredient you can clearly see. Use short common English names (e.g. "egg", "paneer", "curd", "tomato", "coriander", "milk", "leftover sabzi").
Ignore containers you can't see into. Return JSON only: {"items": ["egg", "tomato"], "note": "one short friendly sentence about the fridge"}`;
    const out = await this.json(prompt, dataUrl);
    return { items: (out.items || []).map(normalizeIngredient).filter(Boolean), note: out.note || '' };
  },

  async chefSpecial(have, win, hideCals, after) {
    const prompt = `You are MODO, a warm, slightly cheeky Indian home-cooking coach.
The person just finished: ${after || 'a workout'}. They have: ${have.join(', ')}. Assume salt, oil and basic masalas.
Target for this meal: ${win.lo}-${win.hi} kcal${hideCals ? ' (do not mention calories in the text)' : ''}. Prefer protein after exercise.
Invent ONE dish using mostly what they have. Keep it to ingredients from the list plus pantry basics.
Return JSON only: {"name": "...", "emoji": "one emoji", "mins": 15, "kcal": 450, "protein": 25, "uses": ["egg","onion"], "steps": ["...", "...", "..."], "why": "one short sentence on why this suits them right now"}`;
    return await this.json(prompt);
  },
};

function dataUrlToBlob(u) {
  const [head, b64] = u.split(',');
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: (head.match(/data:(.*?);/) || [])[1] || 'image/jpeg' });
}

function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}

/* Live weather + air quality from Open-Meteo (no key). Falls back to a labelled demo scenario. */
async function fetchWeather(lat, lon) {
  const w = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&timezone=auto`;
  const a = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`;
  const [wr, ar] = await Promise.all([withTimeout(fetch(w), 6000), withTimeout(fetch(a), 6000)]);
  const wj = await wr.json(), aj = await ar.json();
  const code = wj.current.weather_code;
  const rain = wj.current.precipitation > 0.1 || (code >= 51 && code <= 82) || code >= 95;
  return { temp: Math.round(wj.current.temperature_2m), rain, code, aqi: Math.round(aj.current.us_aqi), demo: false };
}

function weatherWord(w) {
  if (!w) return '';
  if (w.rain) return 'Rain';
  if (w.code === 45 || w.code === 48) return 'Haze';
  if (w.code <= 1) return 'Clear';
  if (w.code <= 3) return 'Cloudy';
  return 'Mixed';
}

function aqiWord(a) {
  if (a == null) return '';
  if (a <= 50) return 'Good';
  if (a <= 100) return 'Okay';
  if (a <= 150) return 'Meh';
  if (a <= 200) return 'Unhealthy';
  if (a <= 300) return 'Bad';
  return 'Hazardous';
}

/* Downscale photos before sending them anywhere. */
function shrinkImage(file, maxSide = 1024) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function Feed({ feed, idx, decide, reshuffle, go, sel }) {
  const cards = feed.cards.slice(idx, idx + 3);
  const n = feed.cards.length;
  const pri = { sleep: 0, air: 1, rain: 1, heat: 1, good: 3 };
  const shown = feed.notes.filter(x => x.kind !== 'steps').sort((a, b) => pri[a.kind] - pri[b.kind]).slice(0, 2);
  const icon = { sleep: '😴', air: '🌫️', rain: '🌧️', heat: '🥵', good: '🌤️' };
  return html`<section class="screen">
    <${Bar} onBack=${() => go('home')} title=${n ? `Match ${Math.min(idx + 1, n)} of ${n}` : 'No matches'} />
    ${shown.length > 0 && html`<div class="notes">${shown.map(n => html`<div class=${'note ' + (n.kind === 'good' ? 'sage' : 'lav')}>${icon[n.kind]}<span>${n.text}</span></div>`)}</div>`}
    ${cards.length
      ? html`<${Deck} key=${idx} cards=${cards} idx=${idx} decide=${decide} sel=${sel} />`
      : html`<div class="stack" style="margin:auto 0;text-align:center">
          <div style="font-size:64px">🤷</div>
          <h2 class="h1">You’re picky today. Fair.</h2>
          <p class="sub">Want a fresh batch, or should I trick you into moving instead?</p>
          <button class="cta mt" onClick=${reshuffle}>Show me more</button>
          <button class="ghost" onClick=${() => go('trick')}>Trick me</button>
        </div>`}
  </section>`;
}

function Deck({ cards, idx, decide, sel }) {
  const [d, setD] = useState({ x: 0, y: 0, active: false });
  const [leaving, setLeaving] = useState(null);
  const start = useRef(null);
  const top = cards[0];

  const fly = (dir) => {
    if (leaving) return;
    setLeaving(dir);
    setTimeout(() => decide(top, dir === 'yes'), 280);
  };
  const onDown = (e) => { if (leaving) return; start.current = { x: e.clientX, y: e.clientY }; e.currentTarget.setPointerCapture(e.pointerId); setD({ x: 0, y: 0, active: true }); };
  const onMove = (e) => { if (!start.current) return; setD({ x: e.clientX - start.current.x, y: (e.clientY - start.current.y) * .4, active: true }); };
  const onUp = () => {
    if (!start.current) return; start.current = null;
    if (d.x > 100) fly('yes'); else if (d.x < -100) fly('no'); else setD({ x: 0, y: 0, active: false });
  };
  useEffect(() => {
    const k = (e) => { if (e.key === 'ArrowRight') fly('yes'); if (e.key === 'ArrowLeft') fly('no'); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  });

  const tx = leaving ? (leaving === 'yes' ? 520 : -520) : d.x;
  const style = `transform: translate(${tx}px, ${d.y}px) rotate(${tx / 16}deg); transition: ${d.active && !leaving ? 'none' : 'transform .3s cubic-bezier(.2,.8,.2,1)'}`;
  const yesO = Math.max(0, Math.min(1, tx / 100)), noO = Math.max(0, Math.min(1, -tx / 100));
  const yesLbl = YES[idx % YES.length], noLbl = NO[idx % NO.length];

  return html`
    <div class="deck">
      ${cards.slice(1).reverse().map((c, i, arr) => html`<div class=${'card c' + ((idx + arr.length - i) % 2) + (arr.length - i === 1 ? ' under' : ' under2')} aria-hidden="true">
        <div class="big-e">${c.act.emoji}</div><h3>${c.act.title}</h3></div>`)}
      <div class=${'card c' + (idx % 2)} style=${style} onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}>
        <div class="stamp yes" style=${'opacity:' + yesO}>${yesLbl}</div>
        <div class="stamp no" style=${'opacity:' + noO}>${noLbl}</div>
        <div class="big-e">${top.act.emoji}</div>
        ${top.act.moods.includes(sel.mood) && html`<p class="fitline">Good for ${byId(MOODS, sel.mood).emoji} ${byId(MOODS, sel.mood).label.toLowerCase()}</p>`}
        <h3>“${top.act.title}.”</h3>
        <p>${top.act.tagline}</p>
        <div class="stats">
          <span class="stat mono">⏱ ${top.mins} min</span>
          <span class="stat">${placeEmoji(top.act, sel)}</span>
          <span class="stat">Effort <${Effort} n=${top.act.effort} /> <span class="mono">${top.act.effort}/10</span></span>
        </div>
      </div>
    </div>
    <div class="swipe-actions">
      <button class="sa no" onClick=${() => fly('no')}>❌ ${noLbl}</button>
      <button class="sa yes" onClick=${() => fly('yes')}>❤️ ${yesLbl}</button>
    </div>
    <p class="hint">Swipe, tap, or use ← → keys. Every swipe teaches MODO your taste.</p>`;
}

/* ---------------- Session player ---------------- */

function Session({ chosen, onDone, go, watch }) {
  const { act, mins, plan } = chosen;
  const total = mins * 60;
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(true);
  const [fast, setFast] = useState(false);
  const doneRef = useRef(false);

  useEffect(() => {
    let lock = null;
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => lock = l).catch(() => {}); } catch (e) {}
    return () => { try { lock && lock.release(); } catch (e) {} };
  }, []);

  useEffect(() => {
    if (!running) return;
    let lastT = performance.now();
    const id = setInterval(() => {
      const now = performance.now(); const dt = (now - lastT) / 1000; lastT = now;
      setElapsed(e => Math.min(total, e + dt * (fast ? 60 : 1)));
    }, 200);
    return () => clearInterval(id);
  }, [running, fast]);

  useEffect(() => { if (elapsed >= total && !doneRef.current) { doneRef.current = true; setTimeout(() => onDone(mins), 500); } }, [elapsed]);

  let acc = 0, cur = 0;
  const bounds = plan.map(s => { const b = { s: acc, e: acc + s.min * 60 }; acc += s.min * 60; return b; });
  bounds.forEach((b, i) => { if (elapsed >= b.s) cur = i; });
  const stepLeft = Math.max(0, bounds[cur].e - elapsed);
  const mm = Math.floor(stepLeft / 60), ss = Math.floor(stepLeft % 60);
  const R = 120, C = 2 * Math.PI * R;
  const prog = elapsed / total;

  return html`<section class="screen">
    <${Bar} onBack=${() => go('reveal')} title=${`${act.emoji} ${act.title}`} />
    <div class="steps-mini">${plan.map((s, i) => {
      const b = bounds[i]; const f = Math.max(0, Math.min(1, (elapsed - b.s) / (b.e - b.s)));
      return html`<i style=${`flex:${s.min}`}><span style=${`transform:scaleX(${f})`}></span></i>`;
    })}</div>
    <div class="ring">
      <svg viewBox="0 0 280 280" aria-hidden="true">
        <circle cx="140" cy="140" r=${R} fill="none" stroke="var(--line)" stroke-width="14" />
        <circle cx="140" cy="140" r=${R} fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C * (1 - prog)} style="transition: stroke-dashoffset .25s linear" />
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--sage-deep)" /><stop offset="1" stop-color="var(--lav-deep)" /></linearGradient></defs>
      </svg>
      <div class="inner">
        <span class="eyebrow">Step ${cur + 1} of ${plan.length}</span>
        <span class="t">${mm}:${String(ss).padStart(2, '0')}</span>
        <span class="small mono">${Math.floor(elapsed / 60)} of ${mins} min</span>
      </div>
    </div>
    <div class="step-now"><b>${plan[cur].label}</b>
      ${plan[cur + 1] && html`<p class="small mt-s">Next: ${plan[cur + 1].label}</p>`}
    </div>
    <ul class="plan-live">${plan.map((s, i) => html`<li class=${i < cur ? 'done' : i === cur ? 'now' : ''}><span>${i < cur ? '✓' : i === cur ? '▸' : '·'}</span><span>${s.label}</span><span class="m">${s.min}m</span></li>`)}</ul>
    <div class="foot">
      ${watch && watch.connected && html`<p class="small" style="text-align:center">❤️ Live heart rate would stream from your ${watch.name} here.</p>`}
      <div class="row">
        <button class="ghost" onClick=${() => setRunning(r => !r)}>${running ? 'Pause' : 'Resume'}</button>
        <button class="cta" style="padding:14px" onClick=${() => { doneRef.current = true; onDone(Math.max(1, elapsed / 60)); }}>I’m done</button>
      </div>
      <button class="toggle" onClick=${() => setFast(f => !f)} aria-pressed=${fast}><span class=${'switch' + (fast ? ' on' : '')}></span> Demo speed (1 second = 1 minute)</button>
    </div>
  </section>`;
}

/* ---------------- After ---------------- */

function After({ last, logAfter, onRefuel, go, history, watch, hideCals }) {
  const [picked, setPicked] = useState(last.after || null);
  const before = last.before ? byId(MOODS, last.before) : null;
  const after = picked ? byId(AFTER_MOODS, picked) : null;
  const withBefore = history.filter(h => h.before && h.after);
  const better = withBefore.filter(h => (byId(AFTER_MOODS, h.after) || {}).v > (BEFORE_V[h.before] || 0)).length;

  return html`<section class="screen">
    <${Bar} onBack=${() => go('home')} title=${last.kind === 'trick' ? 'You moved. Technically.' : 'Session done'} />
    ${!picked ? html`
      <div class="mt" style="font-size:56px">${last.emoji}</div>
      <h1 class="h1">${last.kind === 'trick' ? 'Look at you, not exercising.' : 'You did it.'}</h1>
      <p class="sub">${last.mins} min of moving. Now the important part:</p>
      ${last.photo && html`<div class="photo-proof"><img src=${last.photo} alt="Your photo from the walk" /></div>`}
      <h2 class="h2 mt-l">How do you feel now?</h2>
      <div class="afters mt">${AFTER_MOODS.map(m => html`<button class="opt" onClick=${() => { setPicked(m.id); logAfter(m.id); }}><span class="e">${m.emoji}</span><b>${m.label}</b></button>`)}</div>
    ` : html`
      ${before
        ? html`<div class="shift" aria-label=${`${before.label} to ${after.label}`}><span>${before.emoji}</span><span class="arr">→</span><span>${after.emoji}</span></div>
               <h1 class="h1" style="text-align:center">${after.v > (BEFORE_V[before.id] || 0) ? `From ${before.label.toLowerCase()} to ${after.label.toLowerCase()}.` : after.v === 0 ? 'Not every session is magic.' : `${after.label}. Nice.`}</h1>`
        : html`<div class="shift">${after.emoji}</div><h1 class="h1" style="text-align:center">${after.label}. Told you.</h1>`}
      <p class="sub" style="text-align:center">Moving lifted your mood <b>${better} of ${withBefore.length || 1}</b> times so far.</p>
      <div class="trio mt">
        <div style="background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)"><b class="mono">${last.mins}m</b><span>Moved</span></div>
        <div style="background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)"><b class="mono">${hideCals ? '✓' : '~' + last.burned}</b><span>${hideCals ? 'Done' : 'kcal'}</span></div>
        <div style="background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)"><b>${after.emoji}</b><span>Now</span></div>
      </div>
      ${watch && watch.connected && html`<p class="small mt" style="text-align:center">✓ Logged to ${watch.name} <span class="tag">demo</span></p>`}
      <div class="window mt-l">
        <div><div class="small">Refuel</div><div class="bignum">${hideCals ? 'Hungry?' : `~${last.burned} kcal out.`}</div><div class="small">${hideCals ? 'Show me what’s in your fridge.' : 'Hungry? Show me your fridge.'}</div></div>
        <span style="font-size:40px">🧊</span>
      </div>
      <div class="foot">
        <button class="cta lav" onClick=${onRefuel}>Refuel from my fridge</button>
        <button class="ghost" onClick=${() => go('home')}>Not now</button>
      </div>
    `}
  </section>`;
}

function Refuel({ from, go, profile, setProfile, hideCals, setHideCals, aiMode, say }) {

  const [typed, setTyped] = useState('');

  const [specialState, setSpecialState] = useState('idle');

  const prof = profile || DEFAULT_PROFILE;
  const burned = from ? from.burned : 0;

  const recipes = useMemo(() => matchRecipes(have, win, !!from), [have.join(','), win.lo, !!from]);

  const runSample = () => {
    setSource('sample'); setPhoto(null); setFound([]); setPhase('scanning');

        <button class="scan-opt b" onClick=${runSample}><span class="e">🧊</span><b>Try a sample fridge</b><span>A very hostel fridge</span></button>
      </div>
      <div class="field mt"><label for="typein">Or just type it</label>
        <div class="textin"><input id="typein" placeholder="eggs, paneer, leftover dal…" value=${typed} onInput=${e => setTyped(e.target.value)} onKeyDown=${e => e.key === 'Enter' && addTyped()} /><button onClick=${addTyped}>Add</button></div>
      </div>
      <p class="small mt">Assumes salt, oil and basic masalas are around. Calorie numbers are estimates, not prescriptions.</p>`}

    ${phase === 'scanning' && html`
      ${top}
      <div class="fridge-wrap mt">
        ${source === 'sample' ? html`<${FridgeArt} found=${found} />` : html`<img src=${photo} alt="Your fridge photo" />`}
        <div class="scanline"></div>
      </div>
      <p class="sub mt" style="text-align:center">${source === 'sample' ? `Spotted ${found.length} things…` : aiMode !== 'off' && AI.images ? 'Reading your fridge…' : 'Looking…'}</p>
      <div class="chips mt-s" style="justify-content:center">${found.map(n => html`<span class="chip on">${ingEmoji(n)} ${n}</span>`)}</div>`}

    ${phase === 'manual' && html`
      ${top}
      ${photo && html`<div class="fridge-wrap mt" style="aspect-ratio:16/7"><img src=${photo} alt="Your fridge photo" /></div>`}
      <div class="note lav mt">👀<span>My AI eyes aren’t switched on in this version, so help me out: tap what’s in there.</span></div>
      <div class="chips mt">${INGREDIENTS.map(([n, e]) => html`<button class=${'chip' + (have.includes(n) ? ' on' : '')} onClick=${() => toggle(n)} aria-pressed=${have.includes(n)}>${e} ${n}</button>`)}</div>
      <div class="foot sticky"><button class="cta" disabled=${!have.length} onClick=${() => setPhase('results')}>Find recipes (${have.length})</button></div>`}

    ${phase === 'results' && html`
      ${top}
      ${aiNote && html`<p class="sub mt-s">${aiNote}</p>`}
      <div class="field mt"><label>In your fridge · tap to remove</label>
        <div class="chips">${have.map(n => html`<button class="chip on" onClick=${() => toggle(n)} aria-label=${'Remove ' + n}>${ingEmoji(n)} ${n} <span class="x">✕</span></button>`)}</div>
        <div class="textin mt-s"><input id="addmore" placeholder="Add something I missed" value=${typed} onInput=${e => setTyped(e.target.value)} onKeyDown=${e => e.key === 'Enter' && addTyped()} /><button onClick=${addTyped}>Add</button></div>
      </div>
      ${windowCard}
      ${aiMode !== 'off' && html`<div class="mt">
        ${specialState === 'idle' && html`<button class="ghost" onClick=${askSpecial}>✨ Ask MODO for a chef’s special</button>`}
        ${specialState === 'loading' && html`<div class="note lav">✨<span>Inventing something with what you have…</span></div>`}
        ${specialState === 'error' && html`<div class="note">🤔<span>The chef is busy. The recipes below still work.</span></div>`}
        ${special && html`<div class="recipe special">
          <button onClick=${() => setOpen(open === 'special' ? null : 'special')}>
            <span class="re">${special.emoji || '✨'}</span>
            <div><h4>${special.name}</h4><div class="meta"><span class="tag">AI special</span><span>${special.mins} min</span>${!hideCals && html`<span>~${special.kcal} kcal</span>`}<span>${special.protein}g protein</span></div></div>
            <span>${open === 'special' ? '−' : '+'}</span></button>
          ${open === 'special' && html`<div class="body"><p style="margin:0">${special.why}</p><ol>${(special.steps || []).map(s => html`<li>${s}</li>`)}</ol></div>`}
        </div>`}
      </div>`}
      <h2 class="h2 mt-l">${recipes.length ? `You can make ${recipes.filter(r => !r.missing.length).length || 'almost'}${recipes.filter(r => !r.missing.length).length ? ' things' : ''}` : 'Hmm.'}</h2>
      ${!recipes.length && html`<p class="sub mt-s">Not enough to cook with. Add a couple more things, or honestly, order dal-chawal.</p>`}
      <div class="stack mt">${recipes.slice(0, 8).map(r => html`<div class="recipe">
        <button onClick=${() => setOpen(open === r.id ? null : r.id)} aria-expanded=${open === r.id}>
          <span class="re">${r.emoji}</span>
          <div><h4>${r.name}</h4>
            <div class="meta"><span>${r.mins} min</span>${!hideCals && html`<span>~${r.kcalS} kcal</span>`}<span>${r.proteinS}g protein</span>${r.servings > 1 && html`<span>1.5× portion</span>`}</div>
            <div class="meta mt-s">${r.missing.length ? html`<span class="fit n">need ${r.missing[0]}</span>` : !hideCals && r.fits ? html`<span class="fit y">fits your window</span>` : html`<span class="fit y">you have it all</span>`}</div>
          </div>
          <span aria-hidden="true">${open === r.id ? '−' : '+'}</span>
        </button>
        ${open === r.id && html`<div class="body"><div class="small">Uses: ${r.used.join(', ')}</div><ol>${r.steps.map(s => html`<li>${s}</li>`)}</ol></div>`}
      </div>`)}</div>
      <div class="foot"><button class="ghost" onClick=${() => go('home')}>Done</button></div>`}
  </section>`;
}

/* ---------------- Trick mode ---------------- */

function Trick({ go, onAccept }) {
  const order = useMemo(() => TRICKS.map((t, i) => [Math.random(), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]), []);
  const [i, setI] = useState(0);
  const tr = TRICKS[order[i % order.length]];
  const quip = i === 0 ? 'Let’s trick you into moving.' : i < 3 ? 'Okay, how about this.' : i < 6 ? 'You’re really committed to not committing.' : 'I respect the dedication. One more?';
  return html`<section class="screen trick-screen">
    <${Bar} onBack=${() => go('home')} />
    <h1 class="h-hero" style="margin-top:6px">Fine.</h1>
    <p class="sub">${quip}</p>
    <div class="trick-card" key=${i}>
      <span class="m">${tr.min} min</span>
      <div class="e">${tr.emoji}</div>
      <h2>${tr.text}</h2>
      <p>${tr.sub}</p>
    </div>
    <p class="small mt">You’re not technically working out. You’re just doing something your body needs.</p>
    <div class="foot">
      <button class="cta" onClick=${() => onAccept(tr)}>Fine, I’ll do it</button>
      <button class="ghost" onClick=${() => setI(i + 1)}>Nope, another one</button>
    </div>
  </section>`;
}

function TrickGo({ trick, onDone, go }) {
  const total = trick.min * 60;
  const [left, setLeft] = useState(total);
  const [fast, setFast] = useState(false);
  const [photo, setPhoto] = useState(null);
  useEffect(() => {
    let lastT = performance.now();
    const id = setInterval(() => { const now = performance.now(); const dt = (now - lastT) / 1000; lastT = now; setLeft(l => Math.max(0, l - dt * (fast ? 60 : 1))); }, 200);
    return () => clearInterval(id);
  }, [fast]);
  const mm = Math.floor(left / 60), ss = Math.floor(left % 60);
  const onPhoto = async (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; try { setPhoto(await shrinkImage(f, 900)); } catch (err) {} };
  return html`<section class="screen trick-screen">
    <${Bar} onBack=${() => go('trick')} />
    <div class="trick-card" style="margin-top:6px"><div class="e">${trick.emoji}</div><h2>${trick.text}</h2><p>${trick.sub}</p></div>
    <div style="text-align:center" class="mt-l">
      <div class="mono" style="font-size:64px;letter-spacing:-.04em;line-height:1">${mm}:${String(ss).padStart(2, '0')}</div>
      <p class="small mt-s">${left > 0 ? 'Go. I’ll wait here.' : 'Time’s up. Did you do it?'}</p>
    </div>
    ${trick.photo && html`<label class="ghost mt" style="display:block;text-align:center;position:relative">📸 ${photo ? 'Change photo' : 'Send me your interesting thing'}<input type="file" accept="image/*" capture="environment" onChange=${onPhoto} style="position:absolute;inset:0;opacity:0" aria-label="Upload your photo" /></label>`}
    ${photo && html`<div class="photo-proof"><img src=${photo} alt="Your photo" /></div>`}
    <div class="foot">
      <button class="cta" onClick=${() => onDone(trick, photo)}>Done. I moved.</button>
      <button class="toggle" style="color:inherit" onClick=${() => setFast(f => !f)} aria-pressed=${fast}><span class=${'switch' + (fast ? ' on' : '')}></span> Demo speed</button>
    </div>
  </section>`;
}

/* ---------------- Me ---------------- */

function Me({ go, taste, history, watch, setSheet, hideCals, setHideCals, profile, setProfile, reset, onRefuel }) {
  const p = tasteProfile(taste);
  const [editing, setEditing] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const withBefore = history.filter(h => h.before && h.after);
  const better = withBefore.filter(h => (byId(AFTER_MOODS, h.after) || {}).v > (BEFORE_V[h.before] || 0)).length;
  const list = (arr) => arr.map(x => x.label).join(', ');
  return html`<section class="screen">
    <${Bar} onBack=${() => go('home')} title="You" />
    <h1 class="h1 mt-s">MODO knows you.</h1>
    <p class="sub">${taste.swipes ? `Learned from ${taste.swipes} swipe${taste.swipes > 1 ? 's' : ''}. The more you swipe, the sharper this gets.` : 'Swipe on a few matches and I’ll start figuring you out.'}</p>
    ${taste.swipes > 0 && html`<div class="taste mt">
      ${p.hate.length > 0 && html`<div class="grp hate"><span class="eyebrow">You hate</span><b>${list(p.hate)}</b></div>`}
      ${p.like.length > 0 && html`<div class="grp like"><span class="eyebrow">You like</span><b>${list(p.like)}</b></div>`}
      ${p.tolerate.length > 0 && html`<div class="grp"><span class="eyebrow">You tolerate</span><b>${list(p.tolerate)}</b></div>`}
      ${p.secret.length > 0 && html`<div class="grp secret"><span class="eyebrow">You secretly love</span><b>${list(p.secret)}</b></div>`}
    </div>`}

    <div class="section">
      <h2 class="h2">Mood log</h2>
      ${history.length
        ? html`<p class="small">Moving lifted your mood ${better} of ${withBefore.length} times.</p>
          <div class="hist">${history.slice(0, 8).map(h => html`<div>
            <span class="em">${h.before ? byId(MOODS, h.before).emoji : '🙅'}→${(byId(AFTER_MOODS, h.after) || { emoji: '·' }).emoji}</span>
            <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.title}</span>
            <span class="small mono">${h.mins}m</span></div>`)}</div>`
        : html`<p class="small">Nothing yet. Your before → after moods will show up here.</p>`}
    </div>

    <div class="section">
      <h2 class="h2">Settings</h2>
      <div class="list">
        <button class="li" onClick=${() => setSheet('watch')}><span class="e">⌚</span>Watch<span class="r">${watch && watch.connected ? watch.name + ' · demo' : 'Not connected'}</span></button>
        <button class="li" onClick=${() => setEditing(!editing)}><span class="e">📏</span>Body details<span class="r">${profile ? `${profile.weight} kg · ${profile.height} cm` : 'Not set'}</span></button>
        ${editing && html`<${ProfileForm} initial=${profile} onSave=${(x) => { setProfile(x); setEditing(false); }} />`}
        <button class="li" onClick=${() => setHideCals(!hideCals)} aria-pressed=${hideCals}><span class="e">🙈</span>Hide calorie numbers<span class="r"><span class=${'switch' + (hideCals ? ' on' : '')} style="display:inline-block"></span></span></button>
        <button class="li" onClick=${onRefuel}><span class="e">🥗</span>Refuel from my fridge<span class="r">→</span></button>
        ${confirmReset
          ? html`<div class="row"><button class="ghost" onClick=${() => setConfirmReset(false)}>Keep it</button><button class="cta" style="padding:14px;background:var(--warn)" onClick=${() => { reset(); setConfirmReset(false); }}>Erase</button></div>`
          : html`<button class="li" onClick=${() => setConfirmReset(true)}><span class="e">🧹</span>Reset everything<span class="r">taste, log, watch</span></button>`}
      </div>
      <p class="small">Everything stays in this browser. No account, no tracking.</p>
    </div>
  </section>`;
}

/* ---------------- Sheets ---------------- */

function WatchSheet({ watch, setWatch, close, say }) {
  const [phase, setPhase] = useState(watch && watch.connected ? 'connected' : 'pick');
  const [which, setWhich] = useState(watch ? watch.id : null);
  const connect = (w) => {
    setWhich(w.id); setPhase('syncing');
    setTimeout(() => { setWatch({ ...DEMO_WATCH, id: w.id, name: w.name, connected: true }); setPhase('connected'); say(`${w.name} connected (demo data)`); }, 1500);
  };
  const w = watch && watch.connected ? watch : null;
  return html`<div class="scrim" onClick=${close}></div>
    <div class="sheet" role="dialog" aria-label="Connect your watch">
      <div class="grab"></div>
      ${phase === 'pick' && html`
        <h2 class="h1">Connect your watch</h2>
        <p class="sub">Sleep, heart rate and steps shape what I suggest. Bad night? I go easy on you.</p>
        <div class="list mt">${WATCHES.map(x => html`<button class="li" onClick=${() => connect(x)}><span class="e">${x.emoji}</span>${x.name}<span class="r">Connect →</span></button>`)}</div>
        <div class="note mt">ℹ️<span>This web demo uses sample readings. A live sync needs the native app (Apple HealthKit, Garmin Connect, Fitbit and Health Connect APIs).</span></div>`}
      ${phase === 'syncing' && html`<div style="text-align:center;padding:30px 0"><div class="spinner"></div><h2 class="h2">Syncing ${(byId(WATCHES, which) || {}).name}…</h2><p class="small">Pulling last night’s sleep and today’s steps</p></div>`}
      ${phase === 'connected' && w && html`
        <div class="row" style="align-items:center;justify-content:space-between"><h2 class="h1" style="margin:0">${w.name}</h2><span class="tag" style="flex:none">demo data</span></div>
        <div class="readings mt">
          <div><b class="mono">${fmtSleep(w.sleepMin)}</b><span>Sleep last night</span></div>
          <div><b class="mono">${w.restingHr} bpm</b><span>Resting HR · ${w.restingHr - w.hrBaseline > 0 ? '+' : ''}${w.restingHr - w.hrBaseline} vs usual</span></div>
          <div><b class="mono">${w.steps.toLocaleString('en-IN')}</b><span>Steps today</span></div>
          <div><b class="mono">${w.hrv} ms</b><span>HRV · on the low side</span></div>
        </div>
        <div class="note sage mt">🧠<span><b>What I’m doing with this:</b> short sleep and a raised resting heart rate, so I’m capping effort at 6/10 today. Low steps, so even a walk counts.</span></div>
        <div class="foot"><button class="cta" onClick=${close}>Done</button><button class="ghost" onClick=${() => { setWatch(null); setPhase('pick'); }}>Disconnect</button></div>`}
    </div>`;
}

function ContextSheet({ cityId, setCityId, scenario, setScenario, weather, weatherState, close, setLive, setWeatherState }) {
  const [locMsg, setLocMsg] = useState('');
  const useHere = () => {
    if (!navigator.geolocation) { setLocMsg('Location isn’t available here. Pick a city instead.'); return; }
    setLocMsg('Finding you…');
    navigator.geolocation.getCurrentPosition(pos => {
      setScenario(null); setCityId('here'); setWeatherState('loading');
      fetchWeather(pos.coords.latitude, pos.coords.longitude).then(w => { setLive({ ...w, place: 'Near you' }); setWeatherState('live'); setLocMsg(''); })
        .catch(() => { setWeatherState('offline'); setLocMsg('Couldn’t load weather for your spot.'); });
    }, () => setLocMsg('Location isn’t available here. Pick a city instead.'), { timeout: 8000 });
  };
  return html`<div class="scrim" onClick=${close}></div>
    <div class="sheet" role="dialog" aria-label="Weather and air">
      <div class="grab"></div>
      <h2 class="h1">Outside right now</h2>
      <p class="sub">${weather.place}: ${weather.temp}°, ${weatherWord(weather).toLowerCase()}, AQI ${weather.aqi} (${aqiWord(weather.aqi).toLowerCase()}). ${weatherState === 'live' && !scenario ? 'Live from Open-Meteo.' : 'Demo values.'}</p>
      <div class="field mt"><label>Live weather for</label>
        <div class="seg">${CITIES.map(c => html`<button class=${!scenario && cityId === c.id ? 'sel' : ''} onClick=${() => setCityId(c.id)}>${c.name}</button>`)}
        <button class=${!scenario && cityId === 'here' ? 'sel' : ''} onClick=${useHere}>📍 Near me</button></div>
        ${locMsg && html`<p class="small mt-s">${locMsg}</p>`}
        ${weatherState === 'offline' && !scenario && html`<p class="small mt-s">Live weather couldn’t load here, so you’re seeing demo values.</p>`}
      </div>
      <div class="field mt"><label>Or simulate a day (for the demo)</label>
        <div class="seg">${Object.entries(SCENARIOS).map(([k, s]) => html`<button class=${scenario === k ? 'sel' : ''} onClick=${() => setScenario(k)}>${s.label}</button>`)}</div>
      </div>
      <div class="note lav mt">🌫️<span>When the air is bad or it’s pouring and you could be anywhere, I nudge you indoors. If you’ve said you’re outside, I warn you and keep the effort sensible.</span></div>
      <div class="foot"><button class="cta" onClick=${close}>Done</button></div>
    </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script></body></html>
